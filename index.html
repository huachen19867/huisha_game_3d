<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111310">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="src/style.css">
    <link rel="stylesheet" href="src/lock.css">
    <link rel="stylesheet" href="src/water.css">
    <link rel="stylesheet" href="src/memory.css">
    <link rel="stylesheet" href="src/evidence.css">
    <link rel="stylesheet" href="src/exploration.css">
    <link rel="stylesheet" href="src/settings.css">
    <link rel="stylesheet" href="src/portrait.css">
    <link rel="stylesheet" href="src/map.css">
    <title>回煞 3D · 归门与余温</title>
</head>
<body>
    <main id="world" aria-label="旧宅三维场景"></main>
    <div class="grain" aria-hidden="true"></div>
    <section id="title-screen" class="title-screen" aria-labelledby="game-name">
        <div class="edition">中 式 民 俗 悬 疑 <span>归门 / 余温</span></div>
        <div class="title-content">
            <p class="eyebrow">RETURN TO THE THRESHOLD</p>
            <h1 id="game-name">回<span>煞</span></h1>
            <p class="tagline">门闩在你这边。</p>
            <div class="title-actions">
                <button id="begin" class="primary" disabled>正在准备旧宅…</button>
                <button id="restart" class="quiet" hidden>重新回家</button>
                <button id="title-settings" class="quiet" disabled>游玩设置</button>
            </div>
            <p id="load-status" class="muted" role="status">正在载入场景与器物</p>
        </div>
        <aside class="letter-card"><span class="seal">家书</span><p>七月十四，回来一趟。</p><p>不要再替我守灯。</p><small>落款是母亲的名字。<br>她已经去世十年了。</small></aside>
        <footer class="title-footer"><span>观察 · 记住 · 自己决定</span><span>建议戴耳机游玩</span></footer>
    </section>
    <section id="hud" class="hud" hidden aria-label="探索界面">
        <div class="hud-top"><div class="chapter"><span id="chapter-number">壹</span><p><span id="chapter-name">归 门</span><small id="objective"></small></p></div><nav><button id="map">地图 <kbd>M</kbd></button><button id="journal">手记 <kbd>J</kbd></button><button id="pause">暂停 <kbd>Esc</kbd></button></nav></div>
        <div class="reticle" aria-hidden="true"></div>
        <span id="focus-marker" class="focus-marker" hidden aria-hidden="true"></span>
        <button id="prompt" class="prompt" hidden>调查</button>
        <p class="help">WASD 移动 <i>·</i> 鼠标看向物件 <i>·</i> E 调查 <i>·</i> J 手记 <i>·</i> M 地图</p>
        <div id="touch-pad" class="touch-pad" aria-label="移动方向"><button data-move="0,1" aria-label="向前">前</button><button data-move="-1,0" aria-label="向左">左</button><button data-move="0,-1" aria-label="向后">后</button><button data-move="1,0" aria-label="向右">右</button></div>
        <p id="toast" class="toast" role="status" hidden></p>
    </section>
    <section id="lock-inspector" class="lock-inspector" hidden aria-labelledby="lock-title">
        <div class="lock-heading"><h2 id="lock-title">归门字轮</h2><span>看向铜轮，按从左到右的顺序转动</span></div>
        <div class="lock-turns" aria-label="转动实体字轮">
            <button type="button" data-wheel="0">转动左轮 <kbd>1</kbd><small></small></button>
            <button type="button" data-wheel="1">转动中轮 <kbd>2</kbd><small></small></button>
            <button type="button" data-wheel="2">转动右轮 <kbd>3</kbd><small></small></button>
        </div>
        <p id="lock-status" role="status">可以对照已读字迹，再尝试压下门闩。</p>
        <div class="lock-actions"><button id="lock-attempt" type="button">压下门闩</button><button id="lock-records" type="button">回查手记 <kbd>J</kbd></button><button id="lock-hint" type="button">需要提示</button><button id="lock-leave" type="button">退回门前 <kbd>Esc</kbd></button></div>
    </section>
    <section id="water-inspector" class="lock-inspector water-inspector" hidden aria-labelledby="water-title">
        <div class="lock-heading"><h2 id="water-title">量水秤</h2><span>三升与五升 · 留下四升水</span></div>
        <p id="water-levels" class="water-levels"></p>
        <div class="water-controls" aria-label="选桶与量水操作">
            <button type="button" data-bucket="0" aria-pressed="true">选三升桶 <kbd>1</kbd></button>
            <button type="button" data-bucket="1" aria-pressed="false">选五升桶 <kbd>2</kbd></button>
            <button id="water-fill" type="button">添满选中的桶 <kbd>F</kbd></button>
            <button id="water-empty" type="button">倒空选中的桶 <kbd>X</kbd></button>
            <button id="water-pour" type="button">选中桶倒入另一桶 <kbd>P</kbd></button>
            <button id="water-weigh" type="button">五升桶放上秤盘</button>
        </div>
        <p id="water-status" role="status"></p>
        <div class="lock-actions"><button id="water-records" type="button">回查手记 <kbd>J</kbd></button><button id="water-hint" type="button">需要提示</button><button id="water-leave" type="button">退回桌前 <kbd>Esc</kbd></button></div>
    </section>
    <section id="portrait-inspector" class="lock-inspector portrait-inspector" hidden aria-labelledby="portrait-title">
        <div class="lock-heading"><h2 id="portrait-title">母亲的旧相框</h2><span>揭开黑布 · 拿近 · 翻到背面</span></div>
        <p id="portrait-status" role="status"></p>
        <div class="portrait-actions"><button id="portrait-reveal" type="button">揭开黑布</button><button id="portrait-flip" type="button">翻到背面</button><button id="portrait-read" type="button" disabled>阅读背字</button></div>
        <div class="lock-actions"><button id="portrait-records" type="button">回查手记 <kbd>J</kbd></button><button id="portrait-leave" type="button">放回原处 <kbd>Esc</kbd></button></div>
    </section>
    <dialog id="reader" aria-labelledby="reader-title">
        <div class="reader-heading"><p id="reader-eyebrow" class="eyebrow">旧宅 · 观察记录</p><button id="reader-close" class="close" aria-label="合上">合上 <kbd>Esc</kbd></button></div>
        <h2 id="reader-title" tabindex="-1"></h2>
        <div id="reader-body"></div>
        <div id="reader-actions" class="reader-actions"></div>
    </dialog>
    <noscript>请启用 JavaScript 后进入旧宅。</noscript>
    <script type="module" src="src/main.mjs"></script>
</body>
</html>
