<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111310">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="src/style.css">
    <title>回煞 3D · 归门</title>
</head>
<body>
    <main id="world" aria-label="旧宅三维场景"></main>
    <div class="grain" aria-hidden="true"></div>
    <section id="title-screen" class="title-screen" aria-labelledby="game-name">
        <div class="edition">中 式 民 俗 悬 疑 <span>第一章 / 归门</span></div>
        <div class="title-content">
            <p class="eyebrow">RETURN TO THE THRESHOLD</p>
            <h1 id="game-name">回<span>煞</span></h1>
            <p class="tagline">门闩在你这边。</p>
            <div class="title-actions">
                <button id="begin" class="primary" disabled>正在准备旧宅…</button>
                <button id="restart" class="quiet" hidden>重新回家</button>
            </div>
            <p id="load-status" class="muted" role="status">正在载入场景与器物</p>
        </div>
        <aside class="letter-card"><span class="seal">家书</span><p>七月十四，回来一趟。</p><p>不要再替我守灯。</p><small>落款是母亲的名字。<br>她已经去世十年了。</small></aside>
        <footer class="title-footer"><span>观察 · 记住 · 自己决定</span><span>建议戴耳机游玩</span></footer>
    </section>
    <section id="hud" class="hud" hidden aria-label="探索界面">
        <div class="hud-top"><div class="chapter"><span>壹</span><p>归 门<small id="objective"></small></p></div><nav><button id="journal">手记 <kbd>J</kbd></button><button id="pause">暂停 <kbd>Esc</kbd></button></nav></div>
        <div class="reticle" aria-hidden="true"></div>
        <button id="prompt" class="prompt" hidden>调查</button>
        <p class="help">WASD 移动 <i>·</i> 鼠标看向物件 <i>·</i> E 调查 <i>·</i> J 回查记录</p>
        <div id="touch-pad" class="touch-pad" aria-label="移动方向"><button data-move="0,1" aria-label="向前">前</button><button data-move="-1,0" aria-label="向左">左</button><button data-move="0,-1" aria-label="向后">后</button><button data-move="1,0" aria-label="向右">右</button></div>
        <p id="toast" class="toast" role="status" hidden></p>
    </section>
    <dialog id="reader" aria-labelledby="reader-title">
        <div class="reader-heading"><p id="reader-eyebrow" class="eyebrow">旧宅 · 观察记录</p><button id="reader-close" class="close" aria-label="合上">合上 <kbd>Esc</kbd></button></div>
        <h2 id="reader-title" tabindex="-1"></h2>
        <div id="reader-body"></div>
        <div id="reader-actions" class="reader-actions"></div>
    </dialog>
    <noscript>请启用 JavaScript 后进入旧宅。</noscript>
    <script type="module" src="src/main.mjs"></script>
</body>
</html>
